services:
  # --- POSTGRES ---
  ml_db:
    image: postgres:15-alpine
    container_name: ml_db_container
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ml_service_db
    volumes:
      - ml_db_data:/var/lib/postgresql/data
    networks:
      - ml_network

  # --- Redis ---
  redis:
    image: redis:6-alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ml_network

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_container
    ports:
      - "5672:5672"   # Applicaton listener
      - "15672:15672" # Web-interface
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml_network

  # --- MINIO ---
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio_container
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    networks:
      - ml_network

  # --- CREATE BUCKET ---
  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ml_network
    entrypoint: >
      /bin/sh -c "
      echo 'Connecting to MinIO...';
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      echo 'Creating bucket ml-data...';
      mc mb myminio/ml-data --ignore-existing;
      echo 'Bucket ready.';
      exit 0;
      "

  # --- MLFLOW SERVER ---
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    ports:
      - "5001:5000"
    depends_on:
      - ml_db
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://postgres:postgres@ml_db:5432/ml_service_db
      --default-artifact-root s3://ml-data/mlflow/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
    networks:
      - ml_network

  # --- ML PIPELINE ---
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_pipeline_runner
    depends_on:
      - mlflow
      - minio
      - ml_db
      - create-bucket
    volumes:
      - .:/app
    environment:
      - DB_HOST=ml_db
      - DB_PORT=5432
      - S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - DB_NAME=ml_service_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - S3_BUCKET_NAME=ml-data
    networks:
      - ml_network
    command: tail -f /dev/null

  # --- TSA WORKER (Listens to RabbitMQ) ---
  tsa-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsa_worker_container
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
      ml_db:
        condition: service_started
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=job_queue
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=ml-data
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    networks:
      - ml_network
    command: python src/worker.py

volumes:
  ml_db_data:
  minio-data:
  redis_data:
  rabbitmq_data:


networks:
  ml_network:
    driver: bridge
